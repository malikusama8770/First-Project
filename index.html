<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0ea5e9;
      --success: #34d399;
      --danger: #f87171;
      --shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, transparent 50%),
        radial-gradient(900px 500px at 110% 10%, #164e63 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 24px 24px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .output-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    #password {
      flex: 1;
      min-width: 0;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 1rem;
      padding: 12px 14px;
      outline: none;
    }

    #password:focus {
      border-color: var(--accent);
    }

    .btn {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px 16px;
      transition: transform 0.12s ease, background 0.12s ease, opacity 0.12s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-copy {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .btn-copy.copied {
      background: rgba(52, 211, 153, 0.16);
      border-color: var(--success);
      color: var(--success);
    }

    .btn-generate {
      width: 100%;
      margin-top: 8px;
      background: var(--accent);
      color: #082f49;
    }

    .btn-generate:hover:not(:disabled) {
      background: var(--accent-dark);
      color: #fff;
    }

    .status {
      min-height: 1.4em;
      font-size: 0.88rem;
      margin-bottom: 20px;
      color: var(--muted);
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--danger);
    }

    .control {
      margin-bottom: 20px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    #lengthValue {
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .options {
      display: grid;
      gap: 10px;
      margin-bottom: 22px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
    }

    .option input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      .card {
        padding: 22px 16px 18px;
      }

      .output-row {
        flex-direction: column;
      }

      h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Password Generator</h1>
    <p class="subtitle">Create a strong password in your browser. Nothing is sent or stored.</p>

    <div class="output-row">
      <input id="password" type="text" readonly aria-label="Generated password" placeholder="Your password will appear here">
      <button id="copyBtn" class="btn btn-copy" type="button" disabled>Copy</button>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div class="control">
      <div class="control-header">
        <label for="length">Password length</label>
        <span id="lengthValue">16</span>
      </div>
      <input id="length" type="range" min="8" max="32" value="16" aria-valuemin="8" aria-valuemax="32">
    </div>

    <div class="options">
      <label class="option">
        <input id="uppercase" type="checkbox" checked>
        <span>Uppercase letters (A–Z)</span>
      </label>
      <label class="option">
        <input id="lowercase" type="checkbox" checked>
        <span>Lowercase letters (a–z)</span>
      </label>
      <label class="option">
        <input id="numbers" type="checkbox" checked>
        <span>Numbers (0–9)</span>
      </label>
      <label class="option">
        <input id="symbols" type="checkbox">
        <span>Symbols (!@#$%^&* etc.)</span>
      </label>
    </div>

    <button id="generateBtn" class="btn btn-generate" type="button">Generate Password</button>
    <p class="hint">Generated locally with crypto.getRandomValues(). Length 8–32.</p>
  </main>

  <script>
    (function () {
      "use strict";

      var CHARSETS = {
        uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
        lowercase: "abcdefghijklmnopqrstuvwxyz",
        numbers: "0123456789",
        symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?"
      };

      var lengthInput = document.getElementById("length");
      var lengthValue = document.getElementById("lengthValue");
      var passwordInput = document.getElementById("password");
      var generateBtn = document.getElementById("generateBtn");
      var copyBtn = document.getElementById("copyBtn");
      var statusEl = document.getElementById("status");
      var optionIds = ["uppercase", "lowercase", "numbers", "symbols"];
      var copyResetTimer = null;

      function setStatus(message, type) {
        statusEl.textContent = message;
        statusEl.className = "status" + (type ? " " + type : "");
      }

      function getSelectedSets() {
        var selected = [];
        optionIds.forEach(function (id) {
          if (document.getElementById(id).checked) {
            selected.push(CHARSETS[id]);
          }
        });
        return selected;
      }

      function randomIndex(max) {
        var values = new Uint32Array(1);
        var limit = Math.floor(4294967296 / max) * max;
        var value;

        do {
          crypto.getRandomValues(values);
          value = values[0];
        } while (value >= limit);

        return value % max;
      }

      function randomChar(charset) {
        return charset.charAt(randomIndex(charset.length));
      }

      function shuffle(items) {
        for (var i = items.length - 1; i > 0; i--) {
          var j = randomIndex(i + 1);
          var temp = items[i];
          items[i] = items[j];
          items[j] = temp;
        }
        return items;
      }

      function generatePassword() {
        var selected = getSelectedSets();

        if (selected.length === 0) {
          setStatus("Select at least one character type.", "error");
          passwordInput.value = "";
          copyBtn.disabled = true;
          return;
        }

        var length = Number(lengthInput.value);
        if (length < 8 || length > 32) {
          setStatus("Password length must be between 8 and 32.", "error");
          return;
        }

        var pool = selected.join("");
        var chars = [];

        selected.forEach(function (set) {
          chars.push(randomChar(set));
        });

        while (chars.length < length) {
          chars.push(randomChar(pool));
        }

        passwordInput.value = shuffle(chars).join("");
        copyBtn.disabled = false;
        copyBtn.textContent = "Copy";
        copyBtn.classList.remove("copied");
        setStatus("Password generated. It stays only in this browser.", "success");
      }

      function copyPassword() {
        var value = passwordInput.value;
        if (!value) {
          setStatus("Generate a password first.", "error");
          return;
        }

        function showCopied() {
          copyBtn.textContent = "Copied";
          copyBtn.classList.add("copied");
          setStatus("Password copied to clipboard.", "success");
          if (copyResetTimer) {
            clearTimeout(copyResetTimer);
          }
          copyResetTimer = setTimeout(function () {
            copyBtn.textContent = "Copy";
            copyBtn.classList.remove("copied");
          }, 2000);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(value).then(showCopied).catch(function () {
            fallbackCopy(value, showCopied);
          });
        } else {
          fallbackCopy(value, showCopied);
        }
      }

      function fallbackCopy(value, onSuccess) {
        passwordInput.select();
        passwordInput.setSelectionRange(0, value.length);
        try {
          if (document.execCommand("copy")) {
            onSuccess();
          } else {
            setStatus("Could not copy. Select the password and copy it manually.", "error");
          }
        } catch (err) {
          setStatus("Could not copy. Select the password and copy it manually.", "error");
        }
      }

      lengthInput.addEventListener("input", function () {
        lengthValue.textContent = lengthInput.value;
      });

      generateBtn.addEventListener("click", generatePassword);
      copyBtn.addEventListener("click", copyPassword);

      optionIds.forEach(function (id) {
        document.getElementById(id).addEventListener("change", function () {
          if (getSelectedSets().length === 0) {
            setStatus("Select at least one character type.", "error");
          } else if (statusEl.classList.contains("error")) {
            setStatus("");
          }
        });
      });
    })();
  </script>
</body>
</html>
